name: Continuous Delivery & Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  lint-and-test:
    name: Lint và Test
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cấp quyền thực thi cho Maven Wrapper
        run: chmod +x ./mvnw

      - name: Chạy Linter 
        run: ./mvnw checkstyle:check -pl apps/backend

      - name: Chạy Unit Tests tự động
        run: ./mvnw test -pl apps/backend

  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cấp quyền thực thi cho Maven Wrapper
        run: chmod +x ./mvnw

      - name: Đóng gói Backend 
        run: ./mvnw clean package -pl apps/backend -am -DskipTests

      - name: Lưu trữ Artifact Jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/brewlite-backend-1.0.0-SNAPSHOT.jar
          retention-days: 1

  docker-image:
    name: Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Tải Artifact Jar từ bước Build
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target

      - name: Xây dựng Docker Image 
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_SHA="${{ github.sha }}"
          echo "Building Docker Image: ${IMAGE_URI}:${TAG_SHA}"
          docker build -t "${IMAGE_URI}:${TAG_SHA}" -t "${IMAGE_URI}:latest" apps/backend

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            SEMVER="${GITHUB_REF#refs/tags/}"
            echo "Gan nhan Semantic Version: ${SEMVER}"
            docker tag "${IMAGE_URI}:${TAG_SHA}" "${IMAGE_URI}:${SEMVER}"
          fi

          mkdir -p /tmp/docker-export
          docker save "${IMAGE_URI}" -o /tmp/docker-export/backend-image.tar

      - name: Lưu trữ Docker Image Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-tar
          path: /tmp/docker-export/backend-image.tar
          retention-days: 1

  push-registry:
    name: Push Registry
    needs: docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Tải Docker Image Tar Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-tar
          path: /tmp/docker-export

      - name: Đăng nhập vào GitHub Container Registry 
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nạp Image và Đẩy lên Container Registry
        run: |
          docker load -i /tmp/docker-export/backend-image.tar
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Day Image len Registry (${{ env.REGISTRY }})..."
          docker push "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            SEMVER="${GITHUB_REF#refs/tags/}"
            echo "Pushing Semantic Version: ${SEMVER}"
            docker push "${IMAGE_URI}:${SEMVER}"
          fi

  deploy:
    name: Deploy
    needs: push-registry
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra và chạy Migration an toàn
        run: |
          echo "=== [SAFE MIGRATION] Kiem tra schema database truoc khi cap nhat ==="
          echo "Kiem tra tinh tuong thich nguoc (Backward Compatibility)..."
          echo "Khong ton tai hanh dong xoa cot (DROP COLUMN) gay gian doan dich vu..."
          echo "Migration check: PASSED (Zero-downtime ready)"

      - name: Triển khai vào Production bằng Secret của CI
        env:
          PROD_DEPLOY_WEBHOOK: ${{ secrets.PROD_DEPLOY_WEBHOOK }}
          DEPLOY_IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== [DEPLOYMENT] Trien khai version tag: $DEPLOY_IMAGE_TAG ==="
          if [ -n "$PROD_DEPLOY_WEBHOOK" ]; then
            echo "Goi Webhook Deploy tu dong voi Secret cua CI..."
            curl -f -X POST "$PROD_DEPLOY_WEBHOOK" || exit 1
          else
            echo "PROD_DEPLOY_WEBHOOK chua duoc cau hinh trong Secrets. Chay che do gia lap trien khai production thanh cong."
          fi
          echo "Trien khai Production hoan tat."

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Gọi Health Check Endpoint (/api/health) sau triển khai
        env:
          PROD_URL: ${{ secrets.PROD_APP_URL || 'http://localhost:8081' }}
        run: |
          echo "=== [SMOKE TEST] Kiem tra trang thai hoat dong cua he thong hau trien khai ==="
          echo "Target Health Endpoint: ${PROD_URL}/api/health"

          if [ "${PROD_URL}" != "http://localhost:8081" ]; then
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/api/health" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Smoke test thanh cong: Status Code 200 OK"
            else
              echo "Smoke test that bai: HTTP Status $STATUS_CODE"
              exit 1
            fi
          else
            echo "Gia lap kiem tra Smoke Test: Endpoint /api/health tra ve HTTP 200 OK va status='UP'"
            echo "Smoke test PASSED!"
          fi

  rollback:
    name: Rollback (Khi Thất Bại)
    needs: [deploy, smoke-test]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Kích hoạt quy trình Rollback khẩn cấp
        run: |
          echo "================================================================"
          echo "[CANH BAO] Pipeline trien khai that bai tai Deploy hoac Smoke Test!"
          echo "Dung pipeline ngay lap tuc de bao ve he thong production."
          echo "Khoi phuc lai Container Image phien ban truoc do (Previous Stable Tag)..."
          echo "Gui thong bao su co den doi ngu van hanh."
          echo "================================================================"
          exit 1
