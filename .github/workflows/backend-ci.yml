name: Backend Pipeline

on:
  push:
    branches: [ "main", "master"]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
  

    steps:
      - name: Lấy mã nguồn về máy ảo
        uses: actions/checkout@v3

      - name: Cài đặt môi trường Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Cấp quyền thực thi cho Maven Wrapper
        run: chmod +x ./mvnw

      - name: Bước 1 - Install #(Tải thư viện)
        run: ./mvnw dependency:resolve

      - name: Bước 2 - Lint #(Kiểm tra định dạng code)
        run: ./mvnw checkstyle:check

      - name: Bước 3 - Unit Test #(Chạy kiểm thử)
        run: ./mvnw test

      - name: Bước 4 - Build #(Đóng gói ứng dụng)
        run: ./mvnw clean package -DskipTests