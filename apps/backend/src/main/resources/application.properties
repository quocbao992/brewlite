spring.application.name=doan-cnpm
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/app_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host = localhost
spring.data.redis.port = 6379


spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.security.user.name=admin
spring.security.user.password=123456

category.allow-duplicate-display-order=false

# Mock Payment Gateway Config
mock.gateway.base-url=http://localhost:8081
payment.gateway.secret=mock-secret
mock.gateway.delay-ms=500
mock.gateway.success-rate=0.6
