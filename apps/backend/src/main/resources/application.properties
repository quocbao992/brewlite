spring.application.name=doan-cnpm
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/app_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- QUAN TRỌNG: Phải để validate để nhường quyền tạo bảng cho Flyway ---
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=admin
spring.security.user.password=123456

category.allow-duplicate-display-order=false

# --- CẤU HÌNH FLYWAY ---
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true

# Mock Payment Gateway Config
mock.gateway.base-url=http://localhost:8081
payment.gateway.secret=mock-secret
mock.gateway.delay-ms=500
mock.gateway.success-rate=0.6